services:
  - type: web
    name: flux-reseller
    runtime: python
    plan: free  # Free instances sleep when idle. For real-money production, switch to a paid (always-on) plan.
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPPLIER_API_KEY
        sync: false
      # SUPPLIER_API_BASE, CATALOG_SYNC_MINUTES, DB_POOL_MAX_SIZE all have safe
      # defaults in main.py; add them here only if you need to override them.
      - key: BRAND_NAME
        value: FLUX
      - key: SUPPLIER_LOW_BALANCE
        value: "0"
      - key: OPS_STUCK_MINUTES
        value: "30"
      - key: OPS_TOPUP_STALE_HOURS
        value: "12"
      - key: OPS_ALERT_COOLDOWN_MINUTES
        value: "60"
      - key: FLUX_DEMO_MODE
        value: "false"
      - key: PAYMENT_TTL_MINUTES
        value: "20"
