services:
  - type: web
    name: flux-reseller
    runtime: python
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPPLIER_API_KEY
        sync: false
      - key: BRAND_NAME
        value: Storefront
      - key: FLUX_DEMO_MODE
        value: "false"
      - key: PAYMENT_TTL_MINUTES
        value: "20"
