services:
  - type: web
    name: flux-reseller
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: FLUX_DEMO_MODE
        value: "false"
      - key: PAYMENT_TTL_MINUTES
        value: "20"
